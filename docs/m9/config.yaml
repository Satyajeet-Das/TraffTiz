resolved:
  low:
    signal:
      cycle_s: 90
      yellow_s: 3
      all_red_s: 2
      g_min_s: 10
      g_max_s: 70
      green_lost_s: 1
    model:
      saturation_flow_vph:
      - 1860.0
      - 1860.0
      queue_weight:
      - 1.0
      - 1.0
      beta: 1.6
    estimation:
      window_s: 90.0
      include_pending: true
      pending_in_queue: true
    solver:
      name: projected_gradient
      tolerance: 1.0e-06
      max_iterations: 500
      time_budget_s: 0.1
      solver_budget_fraction: 0.8
      accept_unconverged: true
      sgd_max_iterations: 100
    simulation:
      step_length_s: 1.0
      warmup_s: 600.0
      duration_s: 3600.0
    network:
      tls_id: C
      phase_movements:
      - - - N_in
          - S_out
        - - S_in
          - N_out
      - - - E_in
          - W_out
        - - W_in
