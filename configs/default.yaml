# Default settings (docs/TECHNICAL_DESIGN.md, sections 4 to 7).
# Lists are in phase order (NS, EW).

signal:
  cycle_s: 90
  yellow_s: 3
  all_red_s: 2
  g_min_s: 10                        # limits on effective green
  g_max_s: 70
  green_lost_s: 1                    # displayed green = effective green + this (measured in M3)

model:
  saturation_flow_vph: [1860, 1860]  # per lane, measured by scripts/measure_saturation.py
  queue_weight: [1.0, 1.0]
  beta: 0.1                          # veh/s

estimation:
  window_s: 180
  include_pending: true              # count vehicles waiting to enter as arrivals
  pending_in_queue: true             # and add them to the queue
  queue_sampling: cycle_start        # or own_green: read each queue just before its own green

actuated:                            # SUMO actuated baseline; green limits come from `signal`
  max_gap_s: 3.0                     # green ends after this long without a vehicle
  detector_gap_s: 2.0                # detector distance before the stop line, in driving time

solver:
  name: projected_gradient
  tolerance: 1.0e-6
  max_iterations: 500
  sgd_max_iterations: 100            # SGD online: stops here, well inside the time budget
  time_budget_s: 0.1                 # for one whole decision (NFR-03)
  solver_budget_fraction: 0.8        # share of that budget the solver may use
  accept_unconverged: true           # use a feasible, improved but unconverged result

simulation:
  step_length_s: 1.0
  warmup_s: 600
  duration_s: 3600                   # measured period after the warm-up

network:
  tls_id: C
  phase_movements:                   # (from edge, to edge), NS phase then EW phase
    - [[N_in, S_out], [S_in, N_out]]
    - [[E_in, W_out], [W_in, E_out]]

# Replaced by a file from configs/scenarios/.
scenario:
  name: medium
  segments:
    - {start_fraction: 0.0, arrival_rate: [0.12, 0.12]}
